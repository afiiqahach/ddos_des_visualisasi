<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DES — Network Traffic Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0A1628;
      --navy-mid:   #0F2040;
      --navy-light: #162B52;
      --surface:    #F8FAFC;
      --card:       #FFFFFF;
      --border:     #E2E8F0;
      --text-primary:   #0F172A;
      --text-secondary: #475569;
      --text-muted:     #94A3B8;

      --blue:   #2563EB;
      --blue-l: #3B82F6;
      --green:  #059669;
      --green-l:#10B981;
      --amber:  #D97706;
      --amber-l:#F59E0B;
      --purple: #7C3AED;
      --purple-l:#8B5CF6;
      --red:    #DC2626;
      --red-l:  #EF4444;

      --benign-accent: #10B981;
      --ssdp-accent:    #F59E0B;
      --ldap-accent:  #3B82F6;
      --udp-accent:    #8B5CF6;

      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.05);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--navy);
      min-height: 100vh;
      padding: 0;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ── TOP HEADER ─────────────────────────────────── */
    .app-header {
      background: var(--navy-mid);
      border-bottom: 1px solid rgba(255,255,255,.07);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--blue-l), var(--purple-l));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-title h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.01em;
    }

    .header-title p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 1px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .badge-research {
      background: rgba(59,130,246,.18);
      color: #93C5FD;
      border: 1px solid rgba(59,130,246,.3);
    }
    .badge-des {
      background: rgba(139,92,246,.18);
      color: #C4B5FD;
      border: 1px solid rgba(139,92,246,.3);
    }

    /* ── CONTROL PANEL ──────────────────────────────── */
    .control-panel {
      background: var(--navy-light);
      border-bottom: 1px solid rgba(255,255,255,.06);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .control-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 12px;
      color: #CBD5E1;
      font-weight: 500;
      white-space: nowrap;
    }

    .control-group input[type="number"] {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      color: #fff;
      font-size: 12px;
      font-family: 'Fira Code', monospace;
      padding: 6px 10px;
      border-radius: 6px;
      width: 90px;
      transition: border-color .2s, box-shadow .2s;
    }
    .control-group input[type="number"]:focus {
      outline: none;
      border-color: var(--blue-l);
      box-shadow: 0 0 0 3px rgba(59,130,246,.2);
    }
    .control-group input[type="number"]::placeholder { color: #64748B; }

    .btn {
      font-size: 12px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .18s;
      letter-spacing: .01em;
    }
    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .btn-primary {
      background: var(--blue-l);
      color: #fff;
      box-shadow: 0 2px 8px rgba(59,130,246,.35);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--blue);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(59,130,246,.45);
    }
    .btn-secondary {
      background: rgba(255,255,255,.08);
      color: #CBD5E1;
      border: 1px solid rgba(255,255,255,.12);
    }
    .btn-secondary:hover:not(:disabled) {
      background: rgba(255,255,255,.13);
      color: #fff;
    }

    .control-divider {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,.1);
      flex-shrink: 0;
    }

    /* ── MAIN GRID ──────────────────────────────────── */
    .main-content {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      height: calc(100vh - 112px);
      min-height: 500px;
    }

    /* ── SIM CARD ───────────────────────────────────── */
    .sim-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      min-height: 0;
    }

    .sim-card-accent {
      height: 3px;
      flex-shrink: 0;
    }
    #sim-benign .sim-card-accent { background: var(--benign-accent); }
    #sim-ssdp   .sim-card-accent { background: var(--ssdp-accent); }
    #sim-ldap   .sim-card-accent { background: var(--ldap-accent); }
    #sim-udp    .sim-card-accent { background: var(--udp-accent); }

    .sim-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 8px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .sim-card-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sim-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #sim-benign .sim-dot { background: var(--benign-accent); box-shadow: 0 0 6px var(--benign-accent); }
    #sim-ssdp   .sim-dot { background: var(--ssdp-accent);   box-shadow: 0 0 6px var(--ssdp-accent); }
    #sim-ldap   .sim-dot { background: var(--ldap-accent);   box-shadow: 0 0 6px var(--ldap-accent); }
    #sim-udp    .sim-dot { background: var(--udp-accent);    box-shadow: 0 0 6px var(--udp-accent); }

    .sim-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -.01em;
    }

    .sim-status-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all .3s;
    }
    .status-loading { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
    .status-success { background: #D1FAE5; color: #064E3B; border: 1px solid #A7F3D0; }
    .status-error   { background: #FEE2E2; color: #7F1D1D; border: 1px solid #FECACA; }

    /* ── CANVAS AREA ────────────────────────────────── */
    .canvas-area {
      flex: 1;
      min-height: 0;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFBFC;
    }

    .canvas-wrapper-inner {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }

    canvas {
      background: #fff;
      border: 1px solid #E8EDF3;
      border-radius: 6px;
      display: block;
      max-width: 100%;
      height: auto;
      box-shadow: var(--shadow-sm);
    }

    .time-chip {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, .85);
      color: #E2E8F0;
      backdrop-filter: blur(6px);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      font-family: 'Fira Code', monospace;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,.1);
    }

    /* ── RESPONSIVE ─────────────────────────────────── */
    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, auto);
        height: auto;
      }
      .sim-card { min-height: 280px; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="app-header" style="justify-content:center;">
  <h1 style="color:#fff;font-size:15px;font-weight:700;letter-spacing:-.01em;">Discrete Event Simulation — Network Attack Scenarios</h1>
</header>

<!-- ── CONTROLS ── -->
<div class="control-panel">
  <span class="control-label">Simulation Controls</span>
  <div class="control-divider"></div>
  <div class="control-group">
    <label for="global-durationInput">Duration (min)</label>
    <input type="number" id="global-durationInput" min="0.1" max="1000" step="0.1" placeholder="∞ all" />
  </div>
  <div class="control-divider"></div>
  <button class="btn btn-primary" id="global-startBtn" disabled>
    <span>▶</span> Start All
  </button>
  <button class="btn btn-secondary" id="global-resetBtn" disabled>
    <span>↺</span> Reset All
  </button>
</div>

<!-- ── GRID ── -->
<main class="main-content">

  <!-- BENIGN -->
  <div class="sim-card" id="sim-benign">
    <div class="sim-card-accent"></div>
    <div class="sim-card-header">
      <div class="sim-card-left">
        <div class="sim-dot"></div>
        <div class="sim-title">Benign Traffic</div>
      </div>
      <div id="benign-loadStatus" class="sim-status-pill status-loading">⏳ Loading</div>
    </div>
    <div class="canvas-area">
      <div class="canvas-wrapper-inner">
        <canvas id="benign-canvas" width="600" height="220"></canvas>
        <div class="time-chip" id="benign-timeDisplay">T = 0.00 s</div>
      </div>
    </div>
  </div>

  <!-- SSDP -->
  <div class="sim-card" id="sim-ssdp">
    <div class="sim-card-accent"></div>
    <div class="sim-card-header">
      <div class="sim-card-left">
        <div class="sim-dot"></div>
        <div class="sim-title">SSDP Amplification Attack</div>
      </div>
      <div id="ssdp-loadStatus" class="sim-status-pill status-loading">⏳ Loading</div>
    </div>
    <div class="canvas-area">
      <div class="canvas-wrapper-inner">
        <canvas id="ssdp-canvas" width="600" height="220"></canvas>
        <div class="time-chip" id="ssdp-timeDisplay">T = 0.00 s</div>
      </div>
    </div>
  </div>

  <!-- LDAP -->
  <div class="sim-card" id="sim-ldap">
    <div class="sim-card-accent"></div>
    <div class="sim-card-header">
      <div class="sim-card-left">
        <div class="sim-dot"></div>
        <div class="sim-title">LDAP Amplification Attack</div>
      </div>
      <div id="ldap-loadStatus" class="sim-status-pill status-loading">⏳ Loading</div>
    </div>
    <div class="canvas-area">
      <div class="canvas-wrapper-inner">
        <canvas id="ldap-canvas" width="600" height="220"></canvas>
        <div class="time-chip" id="ldap-timeDisplay">T = 0.00 s</div>
      </div>
    </div>
  </div>

  <!-- UDP -->
  <div class="sim-card" id="sim-udp">
    <div class="sim-card-accent"></div>
    <div class="sim-card-header">
      <div class="sim-card-left">
        <div class="sim-dot"></div>
        <div class="sim-title">UDP Flood Attack</div>
      </div>
      <div id="udp-loadStatus" class="sim-status-pill status-loading">⏳ Loading</div>
    </div>
    <div class="canvas-area">
      <div class="canvas-wrapper-inner">
        <canvas id="udp-canvas" width="600" height="220"></canvas>
        <div class="time-chip" id="udp-timeDisplay">T = 0.00 s</div>
      </div>
    </div>
  </div>

</main>

<script>
const ACCENT_COLORS = {
  benign: '#10B981',
  ssdp:   '#F59E0B',
  ldap:   '#3B82F6',
  udp:    '#8B5CF6',
};

const allSimulations = [];

function createSimulation(opts){
  const CONFIG = {
    TILE_DIR: opts.tileDir,
    MAX_TILE_CACHE: 30,
    MIN_ROW_GAP: 45,
    TOP_MARGIN: 50,
    BOTTOM_MARGIN: 40,
    MIN_CANVAS_HEIGHT: 220,
    NUM_SOURCES: opts.numSources || 4,
    NUM_DESTINATIONS: opts.numDestinations || 4,
    PACKET_SPEED: 1.2,
    MAX_DT: 0.05,
    FRAME_SPAWN_BUDGET_MS: 6,
    MAX_SPAWN_PER_FRAME: 2000,
    MAX_ACTIVE_PACKETS: 8000,
    VIS_EVERY: 3,
    PACKET_RADIUS: 3,
    DRAW_EVERY_N: 1,
    MAX_ADVANCE: 0.2,
    SPEED: 2,
    MAX_SPAWN: 5000,
    ACCENT: opts.accent || '#3B82F6',
  };

  const DOM = {
    canvas:      document.getElementById(`${opts.prefix}-canvas`),
    ctx:         document.getElementById(`${opts.prefix}-canvas`).getContext('2d'),
    timeDisplay: document.getElementById(`${opts.prefix}-timeDisplay`),
    loadStatus:  document.getElementById(`${opts.prefix}-loadStatus`),
  };

  const State = {
    indexData: null,
    bucketSec: 1.0,
    srcMap: [], dstMap: [], tileIds: [],
    tileMetaById: new Map(), tileIdToPos: new Map(),
    tileCache: new Map(), tileLoading: new Map(),
    frameCount: 0,
    rankedSources: [], rankedDests: [],
    isRunning: false,
    simTimeSec: 0, baseTimeSec: 0, lastTimestamp: null, targetSimTimeSec: 0,
    sources: new Map(), destinations: new Map(),
    packets: [], currentTilePos: 0, currentTileEventIndex: 0,
    srcTotal: new Map(), visualCounter: 0, sourceToDest: new Map(),
    pairTotal: new Map(), pairSeen: new Map(), pairDoneTime: new Map(),
    pairDoneList: [], topPairs: [], pairArrived: new Map(),
    durationMinutes: null, endTimeSec: null, durationReached: false,

    reset(){
      this.packets = [];
      this.lastTimestamp = null;
      this.isRunning = false;
      this.durationReached = false;
      this.srcTotal.clear();
      this.sources.forEach((_, ip) => this.srcTotal.set(ip, 0));
      this.baseTimeSec = Number(this.indexData?.meta?.t_min ?? 0);
      this.simTimeSec = this.baseTimeSec;
      this.targetSimTimeSec = this.simTimeSec;
      this.endTimeSec = (this.durationMinutes !== null && this.durationMinutes > 0)
        ? this.baseTimeSec + (this.durationMinutes * 60) : null;
      const startTileId = Math.floor(this.simTimeSec / this.bucketSec);
      this.currentTilePos = this.tileIdToPos.has(startTileId) ? this.tileIdToPos.get(startTileId) : 0;
      this.currentTileEventIndex = 0;
      this.frameCount = 0; this.visualCounter = 0;
      this.pairTotal.clear(); this.pairSeen.clear();
      this.pairDoneTime.clear(); this.pairDoneList = [];
      this.pairArrived.clear();
    }
  };

  const Utils = {
    setStatus(type, msg){
      const icons = { loading:'⏳', success:'✅', error:'❌' };
      DOM.loadStatus.className = `sim-status-pill status-${type}`;
      DOM.loadStatus.textContent = `${icons[type]} ${msg}`;
    },
    formatTime(tSec){
      if (tSec < 1e-3) return `${(tSec*1e6).toFixed(1)} µs`;
      if (tSec < 1)    return `${(tSec*1e3).toFixed(1)} ms`;
      if (tSec < 60)   return `${tSec.toFixed(2)} s`;
      const m = Math.floor(tSec/60), s = tSec - m*60;
      return `${m}:${s.toFixed(1)}`;
    },
    clampTileCache(){
      while (State.tileCache.size > CONFIG.MAX_TILE_CACHE){
        State.tileCache.delete(State.tileCache.keys().next().value);
      }
    }
  };

  const DataLoader = {
    async loadIndex(){
      Utils.setStatus('loading', 'Loading…');
      const res = await fetch(`${CONFIG.TILE_DIR}/index.json`);
      if (!res.ok) throw new Error(`Cannot load ${CONFIG.TILE_DIR}/index.json`);
      State.indexData = await res.json();
      State.bucketSec = Number(State.indexData.meta?.bucket_sec ?? 1.0);
      State.srcMap = State.indexData.maps?.src ?? [];
      State.dstMap = State.indexData.maps?.dst ?? [];
      State.tileIds = (State.indexData.tiles ?? []).map(t=>t.id).sort((a,b)=>a-b);
      State.tileMetaById.clear(); State.tileIdToPos.clear();
      (State.indexData.tiles ?? []).forEach(t => State.tileMetaById.set(t.id, t));
      State.tileIds.forEach((id,pos) => State.tileIdToPos.set(id,pos));
      if (Array.isArray(State.indexData.flows) && State.indexData.flows.length > 0){
        this.buildRankingFromFlows(State.indexData.flows);
      } else {
        Utils.setStatus('loading','Ranking…');
        await this.buildRankingBySampling(20, 20000);
      }
      Utils.setStatus('success', `${State.tileIds.length} tiles`);
    },
    buildRankingFromFlows(flows){
      const pairs = [], srcCount = new Map(), dstCount = new Map();
      for (const f of flows){
        const src = (f.src!=null)?String(f.src):State.srcMap[f.srcId];
        const dst = (f.dst!=null)?String(f.dst):State.dstMap[f.dstId];
        const count = Number(f.count||0);
        if (!src||!dst||count<=0) continue;
        pairs.push({src,dst,count});
      }
      pairs.sort((a,b)=>b.count-a.count);
      State.topPairs = pairs;
      for (const p of pairs){
        srcCount.set(p.src,(srcCount.get(p.src)||0)+p.count);
        dstCount.set(p.dst,(dstCount.get(p.dst)||0)+p.count);
      }
      State.rankedSources = Array.from(srcCount.entries()).map(([ip,count])=>({ip,count})).sort((a,b)=>b.count-a.count);
      State.rankedDests   = Array.from(dstCount.entries()).map(([ip,count])=>({ip,count})).sort((a,b)=>b.count-a.count);
    },
    async buildRankingBySampling(nTiles, maxLines){
      const srcCount = new Map(), dstCount = new Map();
      const n = Math.min(nTiles, State.tileIds.length);
      for (let i=0;i<n;i++){
        const events = await this.loadTile(State.tileIds[i], maxLines);
        if (!events) continue;
        for (const e of events){
          srcCount.set(e.source,(srcCount.get(e.source)||0)+1);
          dstCount.set(e.destination,(dstCount.get(e.destination)||0)+1);
        }
      }
      State.rankedSources = Array.from(srcCount.entries()).map(([ip,count])=>({ip,count})).sort((a,b)=>b.count-a.count);
      State.rankedDests   = Array.from(dstCount.entries()).map(([ip,count])=>({ip,count})).sort((a,b)=>b.count-a.count);
    },
    async loadTile(tileId, limitLines=null){
      if (State.tileCache.has(tileId)) return State.tileCache.get(tileId);
      if (State.tileLoading.has(tileId)) return State.tileLoading.get(tileId);
      const meta = State.tileMetaById.get(tileId);
      if (!meta) return null;
      const promise = (async()=>{
        const res = await fetch(`${CONFIG.TILE_DIR}/${meta.file}`);
        if (!res.ok) throw new Error(`Cannot load ${CONFIG.TILE_DIR}/${meta.file}`);
        const text = await res.text();
        const lines = text.split('\n');
        const events = [];
        const n = limitLines ? Math.min(lines.length,limitLines) : lines.length;
        for (let i=0;i<n;i++){
          const line=lines[i];
          if (!line) continue;
          const [t,srcId,dstId]=JSON.parse(line);
          const time=Number(t), source=State.srcMap[srcId], destination=State.dstMap[dstId];
          if (!Number.isFinite(time)||!source||!destination) continue;
          events.push({time,source,destination});
        }
        events.sort((a,b)=>a.time-b.time);
        State.tileCache.set(tileId,events);
        State.tileLoading.delete(tileId);
        Utils.clampTileCache();
        return events;
      })();
      State.tileLoading.set(tileId,promise);
      return promise;
    },
    ensureTileLoaded(tileId){
      if (State.tileCache.has(tileId)) return true;
      if (!State.tileLoading.has(tileId)){
        this.loadTile(tileId).catch(err=>{
          console.error(err);
          Utils.setStatus('error',err.message);
        });
      }
      return false;
    }
  };

  const PositionManager = {
    setup(){
      State.sources.clear(); State.destinations.clear();
      const ns=CONFIG.NUM_SOURCES, nd=CONFIG.NUM_DESTINATIONS;
      let srcList=[], dstList=[];
      if (State.topPairs && State.topPairs.length>0){
        const srcSet=new Set(), dstSet=new Set();
        for (const pair of State.topPairs){
          if (srcSet.size<ns) srcSet.add(pair.src);
          if (dstSet.size<nd) dstSet.add(pair.dst);
          if (srcSet.size>=ns && dstSet.size>=nd) break;
        }
        if (srcSet.size<ns && State.rankedSources)
          for (const s of State.rankedSources){ if(srcSet.size>=ns)break; srcSet.add(s.ip); }
        if (dstSet.size<nd && State.rankedDests)
          for (const d of State.rankedDests){ if(dstSet.size>=nd)break; dstSet.add(d.ip); }
        srcList=Array.from(srcSet).slice(0,ns);
        dstList=Array.from(dstSet).slice(0,nd);
      } else {
        srcList=State.rankedSources.slice(0,ns).map(x=>x.ip);
        dstList=State.rankedDests.slice(0,nd).map(x=>x.ip);
      }
      if (!srcList.length||!dstList.length){ console.error('Empty src/dst list'); return; }
      const needRows=Math.max(srcList.length,dstList.length);
      const neededH=CONFIG.TOP_MARGIN+CONFIG.BOTTOM_MARGIN+(needRows<=1?0:(needRows-1)*CONFIG.MIN_ROW_GAP);
      const newH=Math.max(CONFIG.MIN_CANVAS_HEIGHT,Math.ceil(neededH));
      if (DOM.canvas.height!==newH) DOM.canvas.height=newH;
      const availH=DOM.canvas.height-CONFIG.TOP_MARGIN-CONFIG.BOTTOM_MARGIN;
      const leftX=100, rightX=DOM.canvas.width-100;
      const srcSpacing=srcList.length>1?Math.max(CONFIG.MIN_ROW_GAP,availH/(srcList.length-1)):0;
      srcList.forEach((ip,idx)=>{
        const y=CONFIG.TOP_MARGIN+(srcList.length===1?availH/2:idx*srcSpacing);
        State.sources.set(ip,{x:leftX,y,label:`S${idx+1}`});
      });
      const dstSpacing=dstList.length>1?Math.max(CONFIG.MIN_ROW_GAP,availH/(dstList.length-1)):0;
      dstList.forEach((ip,idx)=>{
        const y=CONFIG.TOP_MARGIN+(dstList.length===1?availH/2:idx*dstSpacing);
        State.destinations.set(ip,{x:rightX,y,label:`D${idx+1}`});
      });
    }
  };

  function buildSourceToDestinationMap(){
    State.sourceToDest=new Map();
    const srcKeys=Array.from(State.sources.keys());
    const dstKeys=Array.from(State.destinations.keys());
    const n=Math.min(srcKeys.length,dstKeys.length);
    for (let i=0;i<n;i++) State.sourceToDest.set(srcKeys[i],dstKeys[i]);
  }

  function buildPairTotalsForCurrentConfig(){
    State.pairTotal.clear(); State.pairSeen.clear();
    State.pairDoneTime.clear(); State.pairDoneList=[];
    const flows=State.indexData?.flows;
    if (!Array.isArray(flows)||!flows.length) return;
    const srcSet=new Set(State.sources.keys()), dstSet=new Set(State.destinations.keys());
    for (const f of flows){
      const src=(f.src!=null)?String(f.src):State.srcMap[f.srcId];
      const dst=(f.dst!=null)?String(f.dst):State.dstMap[f.dstId];
      if (!src||!dst||!srcSet.has(src)||!dstSet.has(dst)) continue;
      const c=Number(f.count||0);
      if (!Number.isFinite(c)||c<=0) continue;
      const key=`${src}|${dst}`;
      State.pairTotal.set(key,(State.pairTotal.get(key)||0)+c);
    }
    for (const key of State.pairTotal.keys()){
      State.pairSeen.set(key,0); State.pairArrived.set(key,0);
    }
  }

  function checkDurationLimit(){
    if (State.endTimeSec===null) return false;
    if (State.durationReached) return true;
    if (State.simTimeSec>=State.endTimeSec||State.targetSimTimeSec>=State.endTimeSec){
      State.durationReached=true;
      State.simTimeSec=State.endTimeSec;
      State.targetSimTimeSec=State.endTimeSec;
      State.isRunning=false;
      const doneLabel=State.durationMinutes>=1
        ?`${State.durationMinutes} min`:`${(State.durationMinutes*60).toFixed(0)} s`;
      Utils.setStatus('success',`⏱ ${doneLabel}`);
      State.packets=[];
      return true;
    }
    return false;
  }

  const Simulation = {
    spawnPackets(){
      const maxSpawn=Math.min(CONFIG.MAX_SPAWN,CONFIG.MAX_SPAWN_PER_FRAME);
      if (State.packets.length>=CONFIG.MAX_ACTIVE_PACKETS) return;
      if (State.endTimeSec!==null&&State.simTimeSec>=State.endTimeSec) return;
      const tStart=performance.now();
      let spawned=0;
      while (spawned<maxSpawn){
        if (performance.now()-tStart>CONFIG.FRAME_SPAWN_BUDGET_MS) break;
        if (State.currentTilePos>=State.tileIds.length) break;
        const tileId=State.tileIds[State.currentTilePos];
        if (tileId==null) break;
        if (!DataLoader.ensureTileLoaded(tileId)) break;
        const events=State.tileCache.get(tileId);
        if (!events||!events.length){ State.currentTilePos++; State.currentTileEventIndex=0; continue; }
        while (State.currentTileEventIndex<events.length&&events[State.currentTileEventIndex].time<=State.simTimeSec){
          if (performance.now()-tStart>CONFIG.FRAME_SPAWN_BUDGET_MS) return;
          if (State.packets.length>=CONFIG.MAX_ACTIVE_PACKETS) return;
          const e=events[State.currentTileEventIndex];
          if (State.endTimeSec!==null&&e.time>State.endTimeSec){ State.currentTilePos=State.tileIds.length; return; }
          const srcPos=State.sources.get(e.source), dstPos=State.destinations.get(e.destination);
          if (srcPos&&dstPos) State.srcTotal.set(e.source,(State.srcTotal.get(e.source)||0)+1);
          if (srcPos&&dstPos){
            const key=`${e.source}|${e.destination}`;
            if (State.pairTotal.has(key)){
              const seen=(State.pairSeen.get(key)||0)+1;
              State.pairSeen.set(key,seen);
              const total=State.pairTotal.get(key);
              if (seen>=total&&!State.pairDoneTime.has(key)){
                const doneRel=Math.max(0,e.time-State.baseTimeSec);
                State.pairDoneTime.set(key,doneRel);
                State.pairDoneList.push({key,doneRel,src:e.source,dst:e.destination});
                State.pairDoneList.sort((a,b)=>a.doneRel-b.doneRel);
              }
            }
            State.visualCounter++;
            if ((State.visualCounter%CONFIG.VIS_EVERY===0)&&State.packets.length<CONFIG.MAX_ACTIVE_PACKETS){
              State.packets.push({source:e.source,destination:e.destination,srcX:srcPos.x,srcY:srcPos.y,destX:dstPos.x,destY:dstPos.y,x:srcPos.x,y:srcPos.y,progress:0});
              spawned++;
              if (spawned>=maxSpawn){ State.currentTileEventIndex++; break; }
            }
          }
          State.currentTileEventIndex++;
        }
        if (State.currentTileEventIndex>=events.length){
          State.currentTilePos++; State.currentTileEventIndex=0;
          const nextId=State.tileIds[State.currentTilePos+1];
          if (nextId!=null) DataLoader.ensureTileLoaded(nextId);
          continue;
        }
        break;
      }
    },
    updatePackets(dt){
      const remaining=[];
      for (const p of State.packets){
        p.progress+=dt*CONFIG.PACKET_SPEED;
        if (p.progress>=1){
          const key=`${p.source}|${p.destination}`;
          if (State.pairArrived.has(key)){
            const arrived=(State.pairArrived.get(key)||0)+1;
            State.pairArrived.set(key,arrived);
            const total=State.pairTotal.get(key);
            if (arrived>=total&&!State.pairDoneTime.has(key)){
              const doneRel=Math.max(0,State.simTimeSec-State.baseTimeSec);
              State.pairDoneTime.set(key,doneRel);
              State.pairDoneList.push({key,doneRel,src:p.source,dst:p.destination});
              State.pairDoneList.sort((a,b)=>a.doneRel-b.doneRel);
            }
          }
        } else {
          p.x=p.srcX+(p.destX-p.srcX)*p.progress;
          p.y=p.srcY+(p.destY-p.srcY)*p.progress;
          remaining.push(p);
        }
      }
      State.packets=remaining;
    },
    hasBacklog(){
      if (State.currentTilePos>=State.tileIds.length) return false;
      const tid=State.tileIds[State.currentTilePos];
      if (tid==null) return false;
      const events=State.tileCache.get(tid);
      if (!events) return false;
      return State.currentTileEventIndex<events.length&&events[State.currentTileEventIndex].time<=State.simTimeSec;
    },
    isEndOfData(){
      if (State.currentTilePos>=State.tileIds.length) return true;
      if (State.currentTilePos<State.tileIds.length-1) return false;
      const tid=State.tileIds[State.currentTilePos];
      if (tid==null) return true;
      const events=State.tileCache.get(tid);
      return events&&State.currentTileEventIndex>=events.length;
    }
  };

  // ── RENDERER (academic style) ──────────────────────
  const Renderer = {
    draw(){
      const ctx=DOM.ctx, canvas=DOM.canvas;
      const accent=CONFIG.ACCENT;

      // Background
      ctx.fillStyle='#FFFFFF';
      ctx.fillRect(0,0,canvas.width,canvas.height);

      // Subtle grid lines
      ctx.strokeStyle='#F1F5F9';
      ctx.lineWidth=1;
      for (let x=0;x<=canvas.width;x+=40){
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
      }
      for (let y=0;y<=canvas.height;y+=30){
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
      }

      // Column headers
      ctx.fillStyle='#64748B';
      ctx.font='bold 10px Inter, sans-serif';
      ctx.textAlign='center';
      ctx.fillText('SOURCE', 100, 18);
      ctx.fillText('DESTINATION', canvas.width-100, 18);

      // Separator lines
      ctx.strokeStyle='#E2E8F0';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,28); ctx.lineTo(canvas.width,28); ctx.stroke();

      // Source nodes
      State.sources.forEach((pos,ip)=>{
        // Flow line (faint)
        State.destinations.forEach((dpos)=>{
          ctx.strokeStyle='rgba(203,213,225,0.4)';
          ctx.lineWidth=1;
          ctx.setLineDash([3,5]);
          ctx.beginPath();
          ctx.moveTo(pos.x,pos.y);
          ctx.lineTo(dpos.x,dpos.y);
          ctx.stroke();
          ctx.setLineDash([]);
        });

        // Node circle
        ctx.beginPath();
        ctx.arc(pos.x,pos.y,6,0,Math.PI*2);
        ctx.fillStyle='#10B981';
        ctx.fill();
        ctx.strokeStyle='#fff';
        ctx.lineWidth=2;
        ctx.stroke();

        // Label
        ctx.fillStyle='#1E293B';
        ctx.font='bold 9px Inter, sans-serif';
        ctx.textAlign='center';
        ctx.fillText(pos.label,pos.x,pos.y-12);

        // Packet count
        const total=State.srcTotal.get(ip)||0;
        ctx.fillStyle='#475569';
        ctx.font='9px Fira Code, monospace';
        ctx.textAlign='right';
        ctx.fillText(total.toLocaleString(),pos.x-10,pos.y+3);
        ctx.textAlign='center';

        // IP address
        ctx.fillStyle='#94A3B8';
        ctx.font='8px Fira Code, monospace';
        const shortIP=ip.length>15?ip.slice(0,12)+'…':ip;
        ctx.fillText(shortIP,pos.x,pos.y+18);
      });

      // Destination nodes
      State.destinations.forEach((pos,ip)=>{
        ctx.beginPath();
        ctx.arc(pos.x,pos.y,6,0,Math.PI*2);
        ctx.fillStyle='#3B82F6';
        ctx.fill();
        ctx.strokeStyle='#fff';
        ctx.lineWidth=2;
        ctx.stroke();

        ctx.fillStyle='#1E293B';
        ctx.font='bold 9px Inter, sans-serif';
        ctx.textAlign='center';
        ctx.fillText(pos.label,pos.x,pos.y-12);

        ctx.fillStyle='#94A3B8';
        ctx.font='8px Fira Code, monospace';
        const shortIP=ip.length>15?ip.slice(0,12)+'…':ip;
        ctx.fillText(shortIP,pos.x,pos.y+18);
      });

      // Packets
      if (State.packets.length>0){
        const r=CONFIG.PACKET_RADIUS;
        ctx.fillStyle=accent;
        ctx.shadowColor=accent;
        ctx.shadowBlur=4;
        ctx.beginPath();
        for (const p of State.packets){
          ctx.moveTo(p.x+r,p.y);
          ctx.arc(p.x,p.y,r,0,Math.PI*2);
        }
        ctx.fill();
        ctx.shadowBlur=0;
      }

      // Time & tile info
      const displayTime=State.endTimeSec!==null&&State.durationReached
        ?Math.max(0,State.endTimeSec-State.baseTimeSec)
        :Math.max(0,State.targetSimTimeSec-State.baseTimeSec);
      DOM.timeDisplay.textContent=`T = ${Utils.formatTime(displayTime)}`;

      // Bottom-left tile counter
      ctx.fillStyle='#CBD5E1';
      ctx.font='8px Fira Code, monospace';
      ctx.textAlign='left';
      ctx.fillText(`tile ${State.currentTilePos+1}/${State.tileIds.length}`,6,canvas.height-6);
      ctx.textAlign='center';
    }
  };

  function animate(ts){
    if (State.lastTimestamp===null){
      State.lastTimestamp=ts; requestAnimationFrame(animate); return;
    }
    let dt=(ts-State.lastTimestamp)/1000;
    State.lastTimestamp=ts;
    dt=Math.min(dt,CONFIG.MAX_DT);

    if (State.isRunning){
      State.targetSimTimeSec+=dt*CONFIG.SPEED;
      if (checkDurationLimit()){ Renderer.draw(); requestAnimationFrame(animate); return; }
      if (State.endTimeSec!==null) State.targetSimTimeSec=Math.min(State.targetSimTimeSec,State.endTimeSec);

      const t0=performance.now();
      while (performance.now()-t0<CONFIG.FRAME_SPAWN_BUDGET_MS){
        const bp=State.currentTilePos,bi=State.currentTileEventIndex;
        Simulation.spawnPackets();
        if (State.currentTilePos===bp&&State.currentTileEventIndex===bi) break;
        if (!Simulation.hasBacklog()) break;
      }

      if (!Simulation.hasBacklog()){
        State.simTimeSec=Math.min(State.targetSimTimeSec,State.simTimeSec+CONFIG.MAX_ADVANCE);
        if (State.endTimeSec!==null) State.simTimeSec=Math.min(State.simTimeSec,State.endTimeSec);
        const t1=performance.now();
        while (performance.now()-t1<CONFIG.FRAME_SPAWN_BUDGET_MS){
          const bp=State.currentTilePos,bi=State.currentTileEventIndex;
          Simulation.spawnPackets();
          if (State.currentTilePos===bp&&State.currentTileEventIndex===bi) break;
          if (!Simulation.hasBacklog()) break;
        }
      }

      Simulation.updatePackets(dt);
      checkDurationLimit();

      if (!State.durationReached&&Simulation.isEndOfData()&&!Simulation.hasBacklog()&&State.packets.length===0){
        State.isRunning=false;
        Utils.setStatus('success','Done');
      }
    }

    State.frameCount++;
    if (State.frameCount%CONFIG.DRAW_EVERY_N===0) Renderer.draw();
    requestAnimationFrame(animate);
  }

  (async function boot(){
    try{
      await DataLoader.loadIndex();
      PositionManager.setup();
      buildSourceToDestinationMap();
      State.reset();
      buildPairTotalsForCurrentConfig();
      const tid0=State.tileIds[State.currentTilePos];
      const tid1=State.tileIds[State.currentTilePos+1];
      if (tid0!=null) DataLoader.ensureTileLoaded(tid0);
      if (tid1!=null) DataLoader.ensureTileLoaded(tid1);
      Renderer.draw();
      requestAnimationFrame(animate);
    } catch(err){
      console.error(err);
      Utils.setStatus('error',err.message);
    }
  })();

  return { State, PositionManager, buildPairTotalsForCurrentConfig, DataLoader, Renderer };
}

// Init 4 simulations
allSimulations.push(createSimulation({ tileDir:'tiles_benign', prefix:'benign', numSources:4, numDestinations:4, accent:'#10B981' }));
allSimulations.push(createSimulation({ tileDir:'tiles_ssdp',   prefix:'ssdp',   numSources:4, numDestinations:4, accent:'#F59E0B' }));
allSimulations.push(createSimulation({ tileDir:'tiles_ldap',   prefix:'ldap',   numSources:4, numDestinations:4, accent:'#3B82F6' }));
allSimulations.push(createSimulation({ tileDir:'tiles_udp',    prefix:'udp',    numSources:4, numDestinations:4, accent:'#8B5CF6' }));

// Global controls
const globalDurationInput = document.getElementById('global-durationInput');
const globalStartBtn      = document.getElementById('global-startBtn');
const globalResetBtn      = document.getElementById('global-resetBtn');

Promise.all(allSimulations.map(sim => new Promise(resolve => {
  const check = setInterval(()=>{ if(sim.State.indexData){ clearInterval(check); resolve(); } },100);
}))).then(()=>{ globalStartBtn.disabled=false; globalResetBtn.disabled=false; });

globalResetBtn.addEventListener('click',()=>{
  if (globalResetBtn.disabled) return;
  const value=parseFloat(globalDurationInput.value);
  const dur=(!isNaN(value)&&value>0)?value:null;
  allSimulations.forEach(sim=>{
    sim.State.durationMinutes=dur;
    sim.PositionManager.setup();
    sim.State.reset();
    sim.buildPairTotalsForCurrentConfig();
    const t0=sim.State.tileIds[sim.State.currentTilePos];
    const t1=sim.State.tileIds[sim.State.currentTilePos+1];
    if(t0!=null) sim.DataLoader.ensureTileLoaded(t0);
    if(t1!=null) sim.DataLoader.ensureTileLoaded(t1);
    sim.Renderer.draw();
  });
  globalStartBtn.textContent='▶ Start All';
});

globalStartBtn.addEventListener('click',()=>{
  if (globalStartBtn.disabled) return;
  const anyDone=allSimulations.some(s=>s.State.durationReached);
  if (anyDone){
    const value=parseFloat(globalDurationInput.value);
    const dur=(!isNaN(value)&&value>0)?value:null;
    allSimulations.forEach(sim=>{
      sim.State.durationMinutes=dur;
      sim.PositionManager.setup();
      sim.State.reset();
      sim.buildPairTotalsForCurrentConfig();
      sim.State.isRunning=true;
      sim.State.lastTimestamp=null;
      sim.State.targetSimTimeSec=sim.State.simTimeSec;
    });
    globalStartBtn.textContent='⏸ Pause All';
  } else {
    const willRun=!allSimulations[0].State.isRunning;
    allSimulations.forEach(sim=>{
      sim.State.isRunning=willRun;
      if(willRun){ sim.State.targetSimTimeSec=sim.State.simTimeSec; sim.State.lastTimestamp=null; }
    });
    globalStartBtn.textContent=willRun?'⏸ Pause All':'▶ Start All';
  }
});
</script>
